name: dutch-interoceptive-scales-validation
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.11
  
  # Core scientific computing (conda-forge recommended for scientific packages)
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  
  # Machine learning
  - scikit-learn>=1.3
  
  # Statistical modeling
  - statsmodels>=0.14
  
  # Visualization
  - matplotlib>=3.7
  - seaborn>=0.12
  
  # Data I/O
  - openpyxl>=3.1
  
  # Development tools (optional)
  - jupyter
  - ipython
  - spyder  # IDE for scientific Python
  
  # pip-only packages
  - pip
  - pip:
    - factor-analyzer>=0.4.0
    - semopy>=2.3.0
    - miceforest>=5.6.0
    - pyreadstat>=1.2.0
