name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Syntax check
        run: python -m py_compile questionnaire_validation_analysis.py
      - name: Ruff (errors only)
        run: ruff check --select E9,F63,F7,F82 .
